name: Lint

on:
  push:
    branches:
      - master
      - private
      - mongodb-migration
  pull_request:
    branches:
      - master
      - private

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install lint dependencies
        run: |
          cp package-dev.json /tmp/owo-package-dev.json
          cp /tmp/owo-package-dev.json package.json
          rm -f package-lock.json
          npm install --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run cyclic dependency check
        run: ./node_modules/dpdm/lib/bin/dpdm.js --exit-code circular:1 ./src/owo.js
