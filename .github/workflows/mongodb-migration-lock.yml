name: MongoDB migration checks

on:
  push:
    branches:
      - mongodb-migration
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  migration-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: mongodb-migration

      - name: Use Node.js 15.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 15.14.0

      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Syntax check MongoDB migration files
        run: |
          node --check src/owo.js
          node --check src/utils/mongo.js
          node --check src/utils/mongoCounters.js
          node --check src/utils/mongoNumeric.js
          node --check src/utils/redis.js
          node --check src/utils/pubsub.js
          node --check src/utils/cacheUtil.js
          node --check src/utils/ban.js
          node --check src/utils/weaponMongoPersistence.js
          node --check src/utils/rewardUtil.js
          node --check src/utils/eventUtil.js
          node --check src/utils/giveaway.js
          node --check src/utils/animalInfoUtil.js
          node --check src/botHandlers/questHandler.js
          node --check src/commands/command.js
          node --check src/commands/commandList/ranking/rankingMongoUtil.js
          node --check src/commands/commandList/ranking/top.js
          node --check src/commands/commandList/ranking/me.js
          node --check src/commands/commandList/zoo/animalUtil.js
          node --check src/commands/commandList/zoo/lootboxUtil.js
          node --check src/commands/commandList/utils/rules.js
          node --check src/commands/commandList/utils/disable.js
          node --check src/commands/commandList/utils/enable.js
          node --check src/commands/commandList/utils/utils/enabledUtil.js
          node --check src/commands/commandList/economy/cowoncy.js
          node --check src/commands/commandList/economy/give.js
          node --check src/commands/commandList/economy/utils/cowoncyUtils.js
          node --check src/commands/commandList/battle/WeaponInterface.js
          node --check src/commands/commandList/battle/util/weaponUtil.js
          node --check src/commands/commandList/patreon/alterBattle.js
          node --check scripts/migrate-mysql-to-mongodb.js
          node --check scripts/migrate-redis-to-mongodb.js
          node --check scripts/audit-mongodb-cutover.js
          node --check scripts/smoke-mongo-runtime.js

      - name: Check circular dependencies
        run: npx -p dpdm@3.13.1 dpdm --exit-code circular:1 ./src/owo.js

      - name: Enforce MongoDB-only runtime
        run: node scripts/audit-mongodb-cutover.js --strict

      - name: Commit lockfile when changed
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package lock for MongoDB migration"
          git push origin HEAD:mongodb-migration

  mongo-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: mongodb-migration

      - name: Use Node.js 15.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 15.14.0

      - name: Install runtime dependencies without native build scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Start MongoDB replica set
        shell: bash
        run: |
          docker run -d --name owo-mongo-smoke -p 27017:27017 mongo:6.0 --replSet rs0 --bind_ip_all

          ready=0
          for i in {1..60}; do
            if docker exec owo-mongo-smoke mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q '^1$'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs owo-mongo-smoke
            exit 1
          fi

          docker exec owo-mongo-smoke mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

          primary=0
          for i in {1..60}; do
            if docker exec owo-mongo-smoke mongosh --quiet --eval 'try { rs.status().myState } catch (e) { 0 }' 2>/dev/null | grep -q '^1$'; then
              primary=1
              break
            fi
            sleep 1
          done
          if [ "$primary" != "1" ]; then
            docker logs owo-mongo-smoke
            exit 1
          fi

      - name: Exercise runtime MongoDB transactions and exact arithmetic
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/owo_smoke?replicaSet=rs0
          MONGODB_DB: owo_smoke
          MONGODB_SERVER_SELECTION_TIMEOUT: 10000
        run: node scripts/smoke-mongo-runtime.js

      - name: Show MongoDB logs on failure
        if: failure()
        run: docker logs owo-mongo-smoke || true

      - name: Stop MongoDB smoke container
        if: always()
        run: docker rm -f owo-mongo-smoke || true
