name: MongoDB migration lockfile

on:
  push:
    branches:
      - mongodb-migration

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: mongodb-migration

      - name: Use Node.js 15.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 15.14.0

      - name: Refresh package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update package lock for MongoDB migration"
          git push origin HEAD:mongodb-migration
